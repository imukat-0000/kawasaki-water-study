<svg viewBox="0 0 440 460" role="img" aria-labelledby="map-title map-description" xmlns="http://www.w3.org/2000/svg">
<style>svg{background:#ffe6be;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;--paper:#ffe6be;--ink:#1d1e1a;--red:#ef442a}.map-block rect{fill:none;stroke:var(--ink);stroke-width:1}.map-road path{fill:none;stroke:var(--ink);stroke-width:2}.map-rail path{fill:none;stroke:var(--ink);stroke-width:5}.map-rail .rail-dashes{stroke:var(--paper);stroke-width:2;stroke-dasharray:10 7}.map-poi{fill:var(--ink);font-size:17px}.map-small{font-size:14px}.map-route{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:5 6;stroke-linejoin:round}.map-destination{fill:var(--red);stroke:none}.map-destination-text{fill:var(--ink);font-size:23px;font-weight:600}.map-destination-sub{fill:var(--ink);font-size:12px}.map-station{fill:var(--red);stroke:var(--paper);stroke-width:2}.map-station-label{fill:var(--ink);font-size:20px;paint-order:stroke;stroke:var(--paper);stroke-width:3;stroke-linejoin:round}.map-legend{fill:var(--ink);font-size:13px}.map-legend path{stroke:var(--red);stroke-width:3;stroke-dasharray:5 6}</style><title id="map-title">会場周辺のアクセス略図</title><desc id="map-description">帝国ホテルプラザ1階が会場です。日比谷駅A13出口はみゆき通り側、有楽町駅日比谷口は線路沿いの北東側、銀座駅C1出口は晴海通り側にあります。建物と駅の位置関係を示した略図で、縮尺と方角は正確ではありません。</desc>
<g class="map-block"><rect x="83" y="24" width="132" height="56" rx="4"/><rect x="91" y="122" width="127" height="74" rx="4"/><rect x="288" y="118" width="86" height="80" rx="4"/></g>
<g class="map-road"><path d="M22 97H418M257 88V418M395 83V418M20 333H416"/></g>
<g class="map-rail"><path d="M20 305H416"/><path d="M20 305H416" class="rail-dashes"/></g>
<g class="map-poi"><text x="149" y="59" text-anchor="middle">日比谷公園</text><text x="154" y="153" text-anchor="middle">帝国ホテル</text><text x="154" y="178" text-anchor="middle">本館</text><text x="331" y="146" text-anchor="middle"><tspan x="331">東京</tspan><tspan x="331" dy="24">ミッドタウン</tspan><tspan x="331" dy="24">日比谷</tspan></text><text x="35" y="88">日比谷通り</text><text x="35" y="357">コリドー通り</text><text x="271" y="333" writing-mode="vertical-rl" class="map-small">みゆき通り</text><text x="406" y="221" writing-mode="vertical-rl" class="map-small">晴海通り</text></g>
<path class="map-route" d="M269 118L257 118V250H225M363 305H257V250H225M383 360L257 360V250H225"/>
<rect class="map-destination" x="85" y="214" width="143" height="70" rx="3"/>
<text x="156" y="243" text-anchor="middle" class="map-destination-text">会場</text><text x="156" y="267" text-anchor="middle" class="map-destination-sub">帝国ホテルプラザ 1階</text>
<g class="map-station"><circle cx="269" cy="118" r="5"/><circle cx="363" cy="305" r="5"/><circle cx="383" cy="360" r="5"/></g>
<g class="map-station-label"><text x="281" y="74">日比谷駅</text><text x="281" y="96" class="map-small">A13出口</text><text x="301" y="278">有楽町駅</text><text x="301" y="297" class="map-small">日比谷口</text><text x="302" y="394">銀座駅</text><text x="302" y="417" class="map-small">C1出口</text></g>
<g class="map-legend"><path d="M24 443H65"/><text x="75" y="449">徒歩ルートの目安</text></g>
</svg>
