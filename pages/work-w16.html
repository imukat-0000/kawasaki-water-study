twork-detail"><figure><img alt="鋳金で制作した金魚の作品「朱色蘭鋳」" decoding="async" loading="lazy" src="/kawasaki-water-study/assets/official-complete/img/vermilion-ranchu-goldfish-kaito-kawasaki.jpg"/></figure><div><p class="work-date">2025</p><h1>朱色蘭鋳</h1><p class="work-motif">金魚（蘭鋳）</p><p class="work-desc">背びれを持たない蘭鋳は、水面に対して丸みだけで泳ぐ。朱色は、その丸みの起伏に沿って濃淡を変える。</p><dl><div><dt>素材</dt><dd>銀・銅・真鍮（アルミ入り）</dd></div><div><dt>技法</dt><dd>真空加圧鋳造法・石膏型・磨き・第一酸化銅の擦り付け・樹脂封入</dd></div></dl><a class="inquiry-link" href="mailto:akaitomato1028@gmail.com?subject=%E4%BD%9C%E5%93%81%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%EF%BC%9A%E6%9C%B1%E8%89%B2%E8%98%AD%E9%8B%B3">この作品について問い合わせる</a></div></article></main><footer class="reading-footer"><a href="/kawasaki-water-study/layout-horizontal.html">屏風のトップへ戻る</a><a href="/kawasaki-water-study/pages/privacy.html">プライバシーポリシー</a><small>© 2026 KAITO KAWASAKI</small></footer><script src="/kawasaki-water-study/assets/reading-pages.js?v=2"></script><script src="/kawasaki-water-study/assets/background-activity.js?v=3"></script><script>window.setBackgroundCovered(false);</script><script src="/kawasaki-water-study/assets/water-ripples-efficient.js?v=5"></script><script src="/kawasaki-water-study/assets/floating-leaves-efficient.js?v=8"></script></body></html>
