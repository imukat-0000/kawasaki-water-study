ale</p><p class="work-motif">鯨（潜水艦のような造形）</p><p class="work-desc">鯨と潜水艦、生き物と機械の境界があいまいな形。緑青と酸化チタン、二つの異なる青が、その境界の両側を同時に覆っている。</p><dl><div><dt>素材</dt><dd>青銅</dd></div><div><dt>技法</dt><dd>重力鋳造・石膏型・緑青酸化・酸化チタンの焼き付け・硫化・蝋コーティング</dd></div></dl><a class="inquiry-link" href="mailto:akaitomato1028@gmail.com?subject=%E4%BD%9C%E5%93%81%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%EF%BC%9A%E9%89%84%E3%83%8E%E9%AF%A8">この作品について問い合わせる</a></div></article></main><footer class="reading-footer"><a href="/kawasaki-water-study/layout-horizontal.html">屏風のトップへ戻る</a><a href="/kawasaki-water-study/pages/privacy.html">プライバシーポリシー</a><small>© 2026 KAITO KAWASAKI</small></footer><script src="/kawasaki-water-study/assets/reading-pages.js?v=2"></script><script src="/kawasaki-water-study/assets/background-activity.js?v=3"></script><script>window.setBackgroundCovered(false);</script><script src="/kawasaki-water-study/assets/water-ripples-efficient.js?v=5"></script><script src="/kawasaki-water-study/assets/floating-leaves-efficient.js?v=8"></script></body></html>
