">カエル</p><p class="work-desc">白雨は、降り始めてすぐに止む雨。銀メッキの明るさと硫化の翳り、短い時間に起きる二つの変化が体表に同居する。</p><dl><div><dt>素材</dt><dd>銀・銅・真鍮（アルミ入り）</dd></div><div><dt>技法</dt><dd>真空加圧鋳造法・石膏型・磨き・硫化・銀メッキ・樹脂コーティング</dd></div></dl><a class="inquiry-link" href="mailto:akaitomato1028@gmail.com?subject=%E4%BD%9C%E5%93%81%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%EF%BC%9A%E9%9B%A8%E3%83%8E%E8%9B%99%E3%80%8C%E7%99%BD%E9%9B%A8%E3%80%8D">この作品について問い合わせる</a></div></article></main><footer class="reading-footer"><a href="/kawasaki-water-study/layout-horizontal.html">屏風のトップへ戻る</a><a href="/kawasaki-water-study/pages/privacy.html">プライバシーポリシー</a><small>© 2026 KAITO KAWASAKI</small></footer><script src="/kawasaki-water-study/assets/reading-pages.js?v=2"></script><script src="/kawasaki-water-study/assets/background-activity.js?v=3"></script><script>window.setBackgroundCovered(false);</script><script src="/kawasaki-water-study/assets/water-ripples-efficient.js?v=5"></script><script src="/kawasaki-water-study/assets/floating-leaves-efficient.js?v=8"></script></body></html>
